[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binfrac"
version = "0.1.0"
description = "Fracción de binarias MS-MS en cúmulos estelares con Gaia DR3 e isócronas MIST"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Camila Ferrus" }, { name = "Claudia Rodríguez" },
    { name = "Luciano Torreblanca" }, { name = "Pablo Díaz Arancibia" },
]
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "astropy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
